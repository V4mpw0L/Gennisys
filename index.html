<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gennisys - Desenvolvimento de Apps</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100vh;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0;
      color: #38bdf8;
    }
    p {
      font-size: 1.2rem;
      margin-top: 10px;
      color: #cbd5e1;
    }
    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 24px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }
    .btn:hover {
      background: #0ea5e9;
    }
    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <header>
    <h1>Gennisys</h1>
    <p>Desenvolvimento de Aplicativos e Soluções Digitais</p>
  </header>

  <a href="mailto:contato@gennisys.com" class="btn">Entre em contato</a>

  <footer>
    © 2025 Gennisys. Todos os direitos reservados.
  </footer>
</body>
</html>
